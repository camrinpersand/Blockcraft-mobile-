if(craftSize===3){const ring=[0,1,2,3,5,6,7,8];if(ring.every(i=>craftGrid[i].type==="cobble")&&!craftGrid[4].type)return{type:"furnace",count:1};for(const mat of [["planks","woodPickaxe"],["cobble","stonePickaxe"],["ironIngot","ironPickaxe"]])if([0,1,2].every(i=>craftGrid[i].type===mat[0])&&craftGrid[4].type==="sticks"&&craftGrid[7].type==="sticks"&&allOtherEmpty([0,1,2,4,7]))return{type:mat[1],count:1};for(const mat of [["planks","woodSword"],["cobble","stoneSword"],["ironIngot","ironSword"]])if(craftGrid[1].type===mat[0]&&craftGrid[4].type===mat[0]&&craftGrid[7].type==="sticks"&&allOtherEmpty([1,4,7]))return{type:mat[1],count:1}}
return null}
function consumeCraft(){for(const c of craftGrid)if(c.type){c.count--;if(c.count<=0){c.type=null;c.count=0}}}
function takeCraftOutput(){const r=craftResult();if(!r)return;consumeCraft();addItem(r.type,r.count);renderUI();saveSoon()}
function invEntries(){return Object.entries(inventory).filter(([,n])=>n>0).sort((a,b)=>(names[a[0]]||a[0]).localeCompare(names[b[0]]||b[0]))}
function stackHTML(t,n){return itemIcon(t)+(n>1?`<span class="uiCount">${n}</span>`:"")}
function renderInventoryGrid(){const box=$("inventoryGrid");box.innerHTML="";const entries=invEntries();for(let i=0;i<36;i++){const d=document.createElement("div");d.className="uiSlot invCell";const e=entries[i];if(e){d.dataset.type=e[0];d.innerHTML=stackHTML(e[0],e[1]);d.onpointerdown=ev=>beginDrag(ev,{source:"inventory",type:e[0]})}box.appendChild(d)}}
function renderCraftGrid(){const area=$("craftArea"),farea=$("furnaceArea");area.style.display="flex";farea.style.display="none";$("uiTitle").textContent=uiMode==="table"?"Crafting Table":"Inventory";const g=$("craftGrid");g.innerHTML="";g.style.gridTemplateColumns=`repeat(${craftSize},46px)`;for(let i=0;i<craftGrid.length;i++){const c=craftGrid[i],d=document.createElement("div");d.className="uiSlot craftCell";d.dataset.craftIndex=i;if(c.type){d.innerHTML=stackHTML(c.type,c.count);d.onpointerdown=ev=>beginDrag(ev,{source:"craft",index:i,type:c.type})}g.appendChild(d)}const out=$("craftOutput"),r=craftResult();out.innerHTML=r?stackHTML(r.type,r.count):"";out.classList.toggle("ready",!!r);out.onpointerdown=r?e=>{e.preventDefault();takeCraftOutput()}:null}
function renderFurnace(){const area=$("craftArea"),farea=$("furnaceArea");area.style.display="none";farea.style.display="grid";$("uiTitle").textContent="Furnace";const s=getFurnace(activeFurnaceKey);for(const [id,key,countKey]of [["furnaceInput","inputType","inputCount"],["furnaceFuel","fuelType","fuelCount"],["furnaceOutput","outputType","outputCount"]]){const d=$(id);d.innerHTML=s[key]?stackHTML(s[key],s[countKey]):"";d.dataset.furnaceSlot=id==="furnaceInput"?"input":id==="furnaceFuel"?"fuel":"output";d.onpointerdown=null;if(s[key]){if(id==="furnaceOutput")d.onpointerdown=e=>{e.preventDefault();addItem(s.outputType,s.outputCount);s.outputType=null;s.outputCount=0;renderUI();saveSoon()};else d.onpointerdown=e=>beginDrag(e,{source:"furnace",slot:d.dataset.furnaceSlot,type:s[key]})}}$("smeltProgress").style.width=clamp(s.progress/8*100,0,100)+"%";$("flame").style.opacity=s.burn>0?1:.25}
function renderUI(){if(!uiOpen)return;if(uiMode==="furnace")renderFurnace();else renderCraftGrid();renderInventoryGrid()}
function beginDrag(e,payload){e.preventDefault();drag={...payload,x:e.clientX,y:e.clientY};const g=$("dragGhost");g.innerHTML=itemIcon(payload.type);g.style.display="flex";moveGhost(e);addEventListener("pointermove",moveGhost);addEventListener("pointerup",endDrag,{once:true})}
function moveGhost(e){if(!drag)return;drag.x=e.clientX;drag.y=e.clientY;const g=$("dragGhost");g.style.left=e.clientX+8+"px";g.style.top=e.clientY+8+"px"}
function takeFromSource(p){if(p.source==="inventory")return removeItem(p.type,1);if(p.source==="craft"){const c=craftGrid[p.index];if(!c||c.type!==p.type||c.count<1)return false;c.count--;if(c.count<=0){c.type=null;c.count=0}return true}if(p.source==="furnace"){const s=getFurnace(activeFurnaceKey),typeKey=p.slot==="input"?"inputType":"fuelType",countKey=p.slot==="input"?"inputCount":"fuelCount";if(s[typeKey]!==p.type||s[countKey]<1)return false;s[countKey]--;if(s[countKey]<=0){s[typeKey]=null;s[countKey]=0}s.progress=0;return true}return false}
function putCraft(index,type){const c=craftGrid[index];if(c.type&&c.type!==type)return false;if(!takeFromSource(drag))return false;c.type=type;c.count++;return true}
function validFurnaceInput(t){return Object.prototype.hasOwnProperty.call(smeltMap,t)}function validFuel(t){return fuelValue(t)>0}
function putFurnace(slot,type){const s=getFurnace(activeFurnaceKey);if(slot==="output")return false;if(slot==="input"&&!validFurnaceInput(type))return false;if(slot==="fuel"&&!validFuel(type))return false;const typeKey=slot==="input"?"inputType":"fuelType",countKey=slot==="input"?"inputCount":"fuelCount";if(s[typeKey]&&s[typeKey]!==type)return false;if(!takeFromSource(drag))return false;s[typeKey]=type;s[countKey]++;return true}
function endDrag(e){removeEventListener("pointermove",moveGhost);const g=$("dragGhost");g.style.display="none";if(!drag)return;const el=document.elementFromPoint(e.clientX,e.clientY),craft=el?.closest?.(".craftCell"),furn=el?.closest?.("[data-furnace-slot]"),inv=el?.closest?.("#inventoryGrid");let placed=false;if(craft&&uiMode!=="furnace")placed=putCraft(+craft.dataset.craftIndex,drag.type);else if(furn&&uiMode==="furnace")placed=putFurnace(furn.dataset.furnaceSlot,drag.type);else if((inv||!el?.closest?.("#craftBox"))&&drag.source!=="inventory"){if(takeFromSource(drag)){addItem(drag.type,1);placed=true}}drag=null;renderUI();refreshHUD();if(placed)saveSoon()}
const smeltMap={rawIron:"ironIngot",rawBeef:"cookedBeef",rawPork:"cookedPork",rawMutton:"cookedMutton"};function fuelValue(t){return t==="coal"?64:t==="log"?12:t==="planks"?8:0}
function updateFurnaces(dt){for(const s of furnaceStates.values()){const out=smeltMap[s.inputType];if(s.burn>0)s.burn=Math.max(0,s.burn-dt);if(out&&(!s.outputType||s.outputType===out)){if(s.burn<=0&&s.fuelType&&s.fuelCount>0){const v=fuelValue(s.fuelType);if(v>0){s.fuelCount--;if(s.fuelCount<=0){s.fuelType=null;s.fuelCount=0}s.burn=v}}if(s.burn>0){s.progress+=dt;if(s.progress>=8){s.progress-=8;s.inputCount--;if(s.inputCount<=0){s.inputType=null;s.inputCount=0}s.outputType=out;s.outputCount=(s.outputCount||0)+1}}}else s.progress=0}if(uiOpen&&uiMode==="furnace")renderFurnace()}
function useTarget(){if(!target)return;if(target.type==="craftingTable")openTable();else if(target.type==="furnace")openFurnace(target.key)}
let saveTimer=null;function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(saveGame,850)}function saveGame(){try{localStorage.setItem("bc4_save",JSON.stringify({v:SAVE_VERSION,seed,inventory,hotbar,selected,health,dayTime,player:{x:player.x,y:player.y,z:player.z,yaw:player.yaw,pitch:player.pitch},overrides:[...overrides.entries()],furnaces:[...furnaceStates.entries()]}))}catch(e){console.warn("Save failed",e)}}
function loadGame(){let data=null;try{data=JSON.parse(localStorage.getItem("bc4_save")||"null")}catch(e){}if(!data){try{const old=JSON.parse(localStorage.getItem("bc3_save")||"null");if(old&&old.seed===seed)data=old}catch(e){}}if(data&&data.seed===seed){Object.assign(inventory,data.inventory||{});for(let i=0;i<9;i++)hotbar[i]=data.hotbar?.[i]||null;selected=clamp(data.selected||0,0,8);health=clamp(data.health||20,1,20);dayTime=typeof data.dayTime==="number"?data.dayTime:.28;for(const[k,v]of data.overrides||[])overrides.set(k,v);for(const[k,v]of data.furnaces||[])furnaceStates.set(k,v);if(data.player)Object.assign(player,data.player)}else{const s=findSpawn();player.x=s.x;player.y=s.y;player.z=s.z}}
let msgTimer;function flash(text){const m=$("msg");m.textContent=text;m.style.opacity="1";clearTimeout(msgTimer);msgTimer=setTimeout(()=>m.style.opacity="0",1250)}
function updateSky(dt){dayTime=(dayTime+dt/420)%1;const angle=dayTime*Math.PI*2-Math.PI/2,sunHeight=Math.sin(angle),night=sunHeight<-.08,twilight=Math.abs(sunHeight)<.2;let c;if(night)c=nightColor.clone().lerp(duskColor,clamp((sunHeight+.35)/.27,0,1));else if(twilight)c=duskColor.clone().lerp(dayColor,clamp((sunHeight+.08)/.28,0,1));else c=dayColor;scene.background.copy(c);scene.fog.color.copy(c);sun.position.set(Math.cos(angle)*70,Math.sin(angle)*75,22);sun.intensity=night?.16:clamp(.35+sunHeight*1.2,.35,1.45);hemi.intensity=night?.42:1.75;cloudMat.opacity=night?.22:.78;mWater.opacity=.6+.04*Math.sin(performance.now()*.0015);for(const c of clouds){c.position.x+=.22*dt;if(c.position.x-player.x>115)c.position.x-=230;if(c.position.x-player.x<-115)c.position.x+=230;if(c.position.z-player.z>115)c.position.z-=230;if(c.position.z-player.z<-115)c.position.z+=230}return night}
const joy=$("joy"),stick=$("stick");let joyId=null;function moveJoy(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.34;let dx=e.clientX-cx,dy=e.clientY-cy,mag=Math.hypot(dx,dy);if(mag>max){dx=dx/mag*max;dy=dy/mag*max}stick.style.transform=`translate(${dx}px,${dy}px)`;move.x=dx/max;move.y=dy/max}joy.onpointerdown=e=>{e.preventDefault();joyId=e.pointerId;joy.setPointerCapture(joyId);moveJoy(e)};joy.onpointermove=e=>{if(e.pointerId===joyId)moveJoy(e)};function joyEnd(e){if(e.pointerId===joyId){joyId=null;move.x=move.y=0;stick.style.transform="translate(0,0)"}}joy.onpointerup=joyEnd;joy.onpointercancel=joyEnd;
const look=$("look");let lookId=null,lastX=0,lastY=0;look.onpointerdown=e=>{e.preventDefault();lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;look.setPointerCapture(lookId)};look.onpointermove=e=>{if(e.pointerId!==lookId||uiOpen)return;player.yaw-=(e.clientX-lastX)*.0044;player.pitch-=(e.clientY-lastY)*.0038;player.pitch=clamp(player.pitch,-1.48,1.48);lastX=e.clientX;lastY=e.clientY};look.onpointerup=e=>{if(e.pointerId===lookId)lookId=null};look.onpointercancel=look.onpointerup;
const bb=$("breakBtn");bb.onpointerdown=e=>{e.preventDefault();startBreak()};bb.onpointerup=stopBreak;bb.onpointercancel=stopBreak;bb.onpointerleave=stopBreak;$("placeBtn").onpointerdown=e=>{e.preventDefault();placeSelected()};$("jump").onpointerdown=e=>{e.preventDefault();jump()};$("useBtn").onpointerdown=e=>{e.preventDefault();useTarget()};$("inventoryBtn").onpointerdown=e=>{e.preventDefault();openPersonal()};$("closeCraft").onclick=closeUI;$("craft").onpointerdown=e=>{if(e.target===$("craft"))closeUI()};
addEventListener("keydown",e=>{keys[e.code]=true;if(e.code==="Space"){e.preventDefault();jump()}if(e.code==="KeyQ")startBreak();if(e.code==="KeyE")placeSelected();if(e.code==="KeyF")useTarget();if(e.code==="KeyI")openPersonal();if(/^Digit[1-9]$/.test(e.code)){selected=+e.code.slice(5)-1;refreshHUD()}});addEventListener("keyup",e=>{keys[e.code]=false;if(e.code==="KeyQ")stopBreak()});addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.6))});document.addEventListener("visibilitychange",()=>{if(document.hidden)saveGame()});addEventListener("beforeunload",saveGame);
loadGame();refreshHUD();camera.position.set(player.x,player.y+player.eye,player.z);camera.rotation.y=player.yaw;camera.rotation.x=player.pitch;desiredChunks();
let prev=performance.now(),lastFrame=0,frames=0,fpsTime=prev,loadedOnce=false,lastRay=0;
function frame(now){
  requestAnimationFrame(frame);
  if(now-lastFrame<1000/TARGET_FPS)return;
  const dt=Math.min(.05,(now-prev)/1000||.022);prev=now;lastFrame=now;
  physics(dt);desiredChunks();processBuilds();
  if(now-lastRay>55){lastRay=now;updateTarget()}
  updateBreak(dt);updateDrops(dt);updateFurnaces(dt);
  const isNight=updateSky(dt);updateMobs(dt,isNight);
  renderer.render(scene,camera);frames++;
  if(now-fpsTime>1000){const fps=Math.round(frames*1000/(now-fpsTime));frames=0;fpsTime=now;$("status").textContent=`${chunks.size} chunks · ${fps} FPS · ${isNight?"Night":"Day"}`}
  if(!loadedOnce&&chunks.size>=20){loadedOnce=true;$("loading").classList.add("hide");setTimeout(()=>$("loading").style.display="none",400)}
}

}catch(e){fail(e)}})();
