function refreshHUD(){const hb=$("hotbar");hb.innerHTML="";for(let i=0;i<9;i++){const t=hotbar[i],d=document.createElement("div");d.className="slot"+(i===selected?" sel":"");d.innerHTML=itemIcon(t)+(t&&inventory[t]>1?`<span class="cnt">${inventory[t]}</span>`:"");d.onpointerdown=e=>{e.preventDefault();selected=i;refreshHUD()};hb.appendChild(d)}$("itemName").textContent=hotbar[selected]?names[hotbar[selected]]:"";const h=$("hearts");h.innerHTML="";for(let i=0;i<10;i++){const s=document.createElement("span");s.className="heart"+(health>=i*2+1?"":" empty");s.textContent="♥";h.appendChild(s)}if($("craft").style.display==="flex")refreshCraft()}
function canCraft(r){return Object.entries(r.need).every(([t,n])=>(inventory[t]||0)>=n)}function refreshCraft(){$("invText").innerHTML=Object.entries(inventory).filter(([,n])=>n>0).map(([t,n])=>`${names[t]} ×${n}`).join(" · ")||"Inventory empty. Punch a tree to get started.";const box=$("recipes");box.innerHTML="";for(const r of recipes){const row=document.createElement("div");row.className="recipe";row.innerHTML=`<div><strong>${r.name}</strong><small>${Object.entries(r.need).map(([t,n])=>`${names[t]} ×${n}`).join(" + ")}</small></div>`;const b=document.createElement("button");b.className="craftBtn";b.textContent="CRAFT";b.disabled=!canCraft(r);b.onclick=()=>{if(!canCraft(r))return;for(const [t,n]of Object.entries(r.need))inventory[t]-=n;addItem(r.out[0],r.out[1]);flash("Crafted "+r.name);saveGame();refreshCraft()};row.appendChild(b);box.appendChild(row)}}function openCraft(){stopBreak();$("craft").style.display="flex";refreshCraft()}function closeCraft(){$("craft").style.display="none"}
const player={x:.5,y:10,z:.5,vx:0,vy:0,vz:0,yaw:0,pitch:-.12,ground:false,height:1.8,radius:.29,eye:1.62};function findSpawn(){for(let r=0;r<28;r++)for(let x=-r;x<=r;x++)for(const z of[-r,r]){const h=terrainHeight(x,z);if(h>SEA+1&&climate(x,z)>.2)return{x:x+.5,z:z+.5,y:h+1.01}}return{x:.5,z:.5,y:terrainHeight(0,0)+1.01}}
const solidAt=(x,y,z)=>solidType(worldBlock(x,y,z));function playerCollides(x,y,z){const r=player.radius;for(let bx=Math.floor(x-r);bx<=Math.floor(x+r);bx++)for(let by=Math.floor(y);by<=Math.floor(y+player.height-.001);by++)for(let bz=Math.floor(z-r);bz<=Math.floor(z+r);bz++)if(solidAt(bx,by,bz))return true;return false}
const move={x:0,y:0},keys={};function jump(){if(player.ground&&$("craft").style.display!=="flex"){player.vy=7.1;player.ground=false}}function damage(amount){health=Math.max(0,health-amount);refreshHUD();$("damageFlash").style.opacity="1";setTimeout(()=>$("damageFlash").style.opacity="0",120);if(health<=0){const s=findSpawn();player.x=s.x;player.y=s.y;player.z=s.z;player.vx=player.vy=player.vz=0;health=20;refreshHUD();flash("You respawned")}}
function physics(dt){if($("craft").style.display==="flex")return;let mx=move.x,mf=-move.y;if(keys.KeyA)mx--;if(keys.KeyD)mx++;if(keys.KeyW)mf++;if(keys.KeyS)mf--;let l=Math.hypot(mx,mf);if(l>1){mx/=l;mf/=l}const sy=Math.sin(player.yaw),cy=Math.cos(player.yaw),speed=4.45,tx=(mx*cy+mf*sy)*speed,tz=(-mx*sy+mf*cy)*speed,a=Math.min(1,dt*12);player.vx+=(tx-player.vx)*a;player.vz+=(tz-player.vz)*a;player.vy=Math.max(-24,player.vy-19*dt);let nx=player.x+player.vx*dt;if(!playerCollides(nx,player.y,player.z))player.x=nx;else player.vx=0;let nz=player.z+player.vz*dt;if(!playerCollides(player.x,player.y,nz))player.z=nz;else player.vz=0;const beforeVy=player.vy,ny=player.y+player.vy*dt;if(!playerCollides(player.x,ny,player.z)){player.y=ny;player.ground=false}else{if(beforeVy<0&&!player.ground){const impact=-beforeVy;if(impact>10.8)damage(Math.max(1,Math.floor((impact-9.8)*1.25)))}if(beforeVy<0)player.ground=true;player.vy=0}if(player.y<MIN_Y-12)damage(20);camera.position.set(player.x,player.y+player.eye,player.z);camera.rotation.y=player.yaw;camera.rotation.x=player.pitch}
const raycaster=new THREE.Raycaster();raycaster.far=5.2;const outline=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.015,1.015,1.015)),new THREE.LineBasicMaterial({color:0x111111}));outline.visible=false;scene.add(outline);
function updateTarget(){raycaster.setFromCamera(new THREE.Vector2(0,0),camera);const hits=raycaster.intersectObjects(rayMeshes,false);target=null;for(const hit of hits){const coord=hit.object.userData.coords?.[hit.instanceId];if(!coord)continue;const t=worldBlock(coord.x,coord.y,coord.z);if(!t||t==="water")continue;const n=hit.face.normal;target={x:coord.x,y:coord.y,z:coord.z,type:t,nx:Math.round(n.x),ny:Math.round(n.y),nz:Math.round(n.z),key:worldKey(coord.x,coord.y,coord.z)};break}if(target){outline.visible=true;outline.position.set(target.x+.5,target.y+.5,target.z+.5)}else outline.visible=false}
const drops=[];function dropMaterial(type){const t=type==="coal"?"coalOre":type==="rawIron"?"ironOre":type,m=materials[t]||mDirt;return Array.isArray(m)?m[2]||m[0]:m}function spawnDrop(type,x,y,z){const mesh=new THREE.Mesh(dropGeo,dropMaterial(type));mesh.position.set(x,y,z);scene.add(mesh);drops.push({type,mesh,vx:(Math.random()-.5)*1.5,vy:2.5+Math.random(),vz:(Math.random()-.5)*1.5,age:0})}
function updateDrops(dt){for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.age+=dt;d.vy-=12*dt;let nx=d.mesh.position.x+d.vx*dt,ny=d.mesh.position.y+d.vy*dt,nz=d.mesh.position.z+d.vz*dt,bx=Math.floor(nx),belowY=Math.floor(ny-.16),bz=Math.floor(nz);if(d.vy<0&&solidAt(bx,belowY,bz)&&ny-.16<belowY+1){ny=belowY+1.16;d.vy=0;d.vx*=.75;d.vz*=.75}d.mesh.position.set(nx,ny,nz);d.mesh.rotation.y+=dt*2.2;const dx=player.x-d.mesh.position.x,dy=player.y+1-d.mesh.position.y,dz=player.z-d.mesh.position.z,dist=Math.hypot(dx,dy,dz);if(d.age>.25&&dist<2.5){const pull=Math.min(1,dt*9);d.mesh.position.x+=dx*pull;d.mesh.position.y+=dy*pull;d.mesh.position.z+=dz*pull;if(dist<.65){scene.remove(d.mesh);drops.splice(i,1);addItem(d.type,1);flash("Picked up "+names[d.type]);saveSoon();continue}}if(d.age>180){scene.remove(d.mesh);drops.splice(i,1)}}}
function heldTool(){const t=hotbar[selected];return t==="woodPickaxe"||t==="stonePickaxe"?t:null}function hardness(type){const tool=heldTool();if(type==="leaves")return.18;if(type==="dirt"||type==="grass"||type==="sand")return.45;if(type==="log"||type==="planks"||type==="craftingTable")return.9;if(type==="stone"||type==="coalOre"||type==="ironOre"||type==="cobble")return tool==="stonePickaxe"?.38:tool==="woodPickaxe"?.58:2.5;return.7}function blockDrop(type,b){const tool=heldTool();if(type==="grass")return"dirt";if(type==="stone")return tool?"cobble":null;if(type==="coalOre")return tool?"coal":null;if(type==="ironOre")return tool==="stonePickaxe"?"rawIron":null;if(type==="leaves")return null;if(type==="water")return null;return type}
let breaking=false,breakKey="",breakTime=0;function startBreak(){if(!target||$("craft").style.display==="flex")return;breaking=true;breakKey="";breakTime=0;$("breakbar").style.display="block"}function stopBreak(){breaking=false;breakKey="";breakTime=0;$("breakbar").style.display="none";$("breakfill").style.width="0%"}
function updateBreak(dt){if(!breaking)return;if(!target){stopBreak();return}if(target.key!==breakKey){breakKey=target.key;breakTime=0}breakTime+=dt;const p=clamp(breakTime/hardness(target.type),0,1);$("breakfill").style.width=p*100+"%";if(p>=1){const b={...target},drop=blockDrop(b.type,b);setOverride(b.x,b.y,b.z,null);if(drop)spawnDrop(drop,b.x+.5,b.y+.55,b.z+.5);stopBreak();flash(drop?"Block broken":"Block broken — no drop")}}
function placeSelected(){if(!target)return;const type=hotbar[selected];if(!placeable.has(type)||(inventory[type]||0)<1){flash(type?"You can't place that":"Your hand is empty");return}const x=target.x+target.nx,y=target.y+target.ny,z=target.z+target.nz;if(worldBlock(x,y,z)&&worldBlock(x,y,z)!=="water")return;const pr=player.radius;if(x+1>player.x-pr&&x<player.x+pr&&z+1>player.z-pr&&z<player.z+pr&&y+1>player.y&&y<player.y+player.height){flash("Can't place inside yourself");return}setOverride(x,y,z,type);removeItem(type,1)}
let saveTimer=null;function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(saveGame,800)}function saveGame(){try{localStorage.setItem("bc3_save",JSON.stringify({v:SAVE_VERSION,seed,inventory,hotbar,selected,health,player:{x:player.x,y:player.y,z:player.z,yaw:player.yaw,pitch:player.pitch},overrides:[...overrides.entries()]}))}catch(e){console.warn("Save failed",e)}}
function loadGame(){let data=null;try{data=JSON.parse(localStorage.getItem("bc3_save")||"null")}catch(e){}if(data&&data.v===SAVE_VERSION&&data.seed===seed){Object.assign(inventory,data.inventory||{});for(let i=0;i<9;i++)hotbar[i]=data.hotbar?.[i]||null;selected=clamp(data.selected||0,0,8);health=clamp(data.health||20,1,20);for(const [k,v]of data.overrides||[])overrides.set(k,v);if(data.player)Object.assign(player,data.player)}else{const s=findSpawn();player.x=s.x;player.y=s.y;player.z=s.z}}
let msgTimer;function flash(text){const m=$("msg");m.textContent=text;m.style.opacity="1";clearTimeout(msgTimer);msgTimer=setTimeout(()=>m.style.opacity="0",1250)}
const joy=$("joy"),stick=$("stick");let joyId=null;function moveJoy(e){const r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.34;let dx=e.clientX-cx,dy=e.clientY-cy,mag=Math.hypot(dx,dy);if(mag>max){dx=dx/mag*max;dy=dy/mag*max}stick.style.transform=`translate(${dx}px,${dy}px)`;move.x=dx/max;move.y=dy/max}joy.onpointerdown=e=>{e.preventDefault();joyId=e.pointerId;joy.setPointerCapture(joyId);moveJoy(e)};joy.onpointermove=e=>{if(e.pointerId===joyId)moveJoy(e)};function joyEnd(e){if(e.pointerId===joyId){joyId=null;move.x=move.y=0;stick.style.transform="translate(0,0)"}}joy.onpointerup=joyEnd;joy.onpointercancel=joyEnd;
const look=$("look");let lookId=null,lastX=0,lastY=0;look.onpointerdown=e=>{e.preventDefault();lookId=e.pointerId;lastX=e.clientX;lastY=e.clientY;look.setPointerCapture(lookId)};look.onpointermove=e=>{if(e.pointerId!==lookId||$("craft").style.display==="flex")return;player.yaw-=(e.clientX-lastX)*.0044;player.pitch-=(e.clientY-lastY)*.0038;player.pitch=clamp(player.pitch,-1.48,1.48);lastX=e.clientX;lastY=e.clientY};look.onpointerup=e=>{if(e.pointerId===lookId)lookId=null};look.onpointercancel=look.onpointerup;
const bb=$("breakBtn");bb.onpointerdown=e=>{e.preventDefault();startBreak()};bb.onpointerup=stopBreak;bb.onpointercancel=stopBreak;bb.onpointerleave=stopBreak;$("placeBtn").onpointerdown=e=>{e.preventDefault();placeSelected()};$("jump").onpointerdown=e=>{e.preventDefault();jump()};$("craftBtn").onpointerdown=e=>{e.preventDefault();openCraft()};$("closeCraft").onclick=closeCraft;$("craft").onpointerdown=e=>{if(e.target===$("craft"))closeCraft()};
addEventListener("keydown",e=>{keys[e.code]=true;if(e.code==="Space"){e.preventDefault();jump()}if(e.code==="KeyQ")startBreak();if(e.code==="KeyE")placeSelected();if(e.code==="KeyC")openCraft();if(/^Digit[1-9]$/.test(e.code)){selected=+e.code.slice(5)-1;refreshHUD()}});addEventListener("keyup",e=>{keys[e.code]=false;if(e.code==="KeyQ")stopBreak()});addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.35))});document.addEventListener("visibilitychange",()=>{if(document.hidden)saveGame()});addEventListener("beforeunload",saveGame);
loadGame();refreshHUD();camera.position.set(player.x,player.y+player.eye,player.z);camera.rotation.y=player.yaw;camera.rotation.x=player.pitch;desiredChunks();let prev=performance.now(),frames=0,fpsTime=prev,loadedOnce=false;function frame(now){const dt=Math.min(.035,(now-prev)/1000||.016);prev=now;physics(dt);desiredChunks();processBuilds();updateTarget();updateBreak(dt);updateDrops(dt);renderer.render(scene,camera);frames++;if(now-fpsTime>1000){const fps=Math.round(frames*1000/(now-fpsTime));frames=0;fpsTime=now;$("status").textContent=`${chunks.size} chunks · ${fps} FPS`}if(!loadedOnce&&chunks.size>=12){loadedOnce=true;$("loading").classList.add("hide");setTimeout(()=>$("loading").style.display="none",400)}requestAnimationFrame(frame)}requestAnimationFrame(frame);setInterval(saveGame,5000);
