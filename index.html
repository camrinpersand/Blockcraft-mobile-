<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Blockcraft Mobile</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#79b9e8;font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 3px #000}.g{background:rgba(15,22,28,.7);border:1px solid rgba(255,255,255,.24);backdrop-filter:blur(6px);box-shadow:0 6px 18px rgba(0,0,0,.3)}#top{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;gap:8px}#top>div{padding:7px 10px;border-radius:10px;font-size:12px}#msg{position:absolute;top:18%;left:50%;transform:translateX(-50%);padding:7px 11px;border-radius:9px;opacity:0;transition:.15s;white-space:nowrap}#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%)}#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 3px #000}#cross:before{left:8px;width:2px;height:18px}#cross:after{top:8px;width:18px;height:2px}#progress{position:absolute;left:50%;top:calc(50% + 24px);transform:translateX(-50%);width:88px;height:7px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.8);border-radius:6px;display:none;overflow:hidden}#fill{height:100%;width:0;background:#fff}#joy{position:absolute;left:16px;bottom:88px;width:118px;height:118px;border-radius:50%;pointer-events:auto}#stick{position:absolute;left:39px;top:39px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.46);border:2px solid rgba(255,255,255,.7)}#look{position:absolute;right:0;top:60px;width:58%;height:calc(100% - 150px);pointer-events:auto}#actions{position:absolute;right:10px;bottom:82px;display:grid;grid-template-columns:62px 62px;gap:8px;pointer-events:auto}.a{height:54px;border-radius:13px;border:1px solid rgba(255,255,255,.25);background:rgba(20,27,33,.75);color:#fff;font-weight:800;font-size:12px;text-shadow:0 1px 2px #000;box-shadow:0 5px 14px rgba(0,0,0,.3)}.a:active{transform:scale(.96)}#jump{grid-column:1/3}#hot{position:absolute;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:3px;padding:4px;border-radius:9px;pointer-events:auto}.slot{position:relative;width:43px;height:43px;border:2px solid rgba(255,255,255,.3);border-radius:5px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:23px}.slot.sel{border-color:#fff;background:rgba(255,255,255,.2);transform:translateY(-3px)}.cnt{position:absolute;right:2px;bottom:0;font-size:10px;font-weight:900}.num{position:absolute;left:2px;top:0;font-size:8px}.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.58);padding:16px;pointer-events:auto}.panel{width:min(520px,100%);max-height:82vh;overflow:auto;background:#20262c;border:2px solid rgba(255,255,255,.18);border-radius:16px;padding:14px;color:white}.head{display:flex;justify-content:space-between;align-items:center}.head h2{margin:0}.x{width:38px;height:38px;border:0;border-radius:9px;background:#3d4851;color:#fff;font-size:22px}.recipe{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-top:1px solid rgba(255,255,255,.1)}.recipe small{color:#cbd3da}.cb{border:0;border-radius:8px;padding:9px 12px;background:#48774b;color:#fff;font-weight:800}.cb:disabled{opacity:.35;background:#555}#start{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(#79b9e8,#a7d8f0 62%,#688b4d);color:#fff}.card{width:min(520px,100%);padding:22px;border-radius:20px;text-align:center;background:rgba(16,23,29,.76);border:1px solid rgba(255,255,255,.25);box-shadow:0 22px 60px rgba(0,0,0,.4)}.card h1{margin:0 0 8px;font-size:38px;letter-spacing:-2px}.card p{font-size:14px;line-height:1.5;color:#e8eef4}.big{width:100%;border:0;border-radius:12px;padding:14px;margin-top:8px;color:white;font-size:16px;font-weight:900}#play{background:#4f9147}#newworld{background:#46525d}#debug{margin-top:10px;font-size:11px;opacity:.78}#err{display:none;margin-top:10px;padding:8px;border-radius:8px;background:rgba(120,0,0,.45);color:#ffdada;font-size:12px}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
  <div id="top"><div class="g" id="stats">❤️ 10 · ⛏ Hand</div><div class="g">Blockcraft · offline</div></div>
  <div id="msg" class="g"></div><div id="cross"></div><div id="progress"><div id="fill"></div></div>
  <div id="joy" class="g"><div id="stick"></div></div><div id="look"></div>
  <div id="actions"><button id="break" class="a">⛏ BREAK</button><button id="place" class="a">🧱 PLACE</button><button id="craftbtn" class="a">🛠 CRAFT</button><button id="save" class="a">💾 SAVE</button><button id="jump" class="a">⬆ JUMP</button></div>
  <div id="hot" class="g"></div>
</div>
<div id="craft" class="modal"><div class="panel"><div class="head"><h2>Crafting</h2><button id="closecraft" class="x">×</button></div><div id="inv" style="font-size:12px;line-height:1.6;color:#dce4eb;margin:10px 0"></div><div id="recipes"></div></div></div>
<script>
(()=>{try{
const $=id=>document.getElementById(id),cv=$("game"),ctx=cv.getContext("2d",{alpha:false});let W,H,dpr,focal;
function resize(){dpr=Math.min(devicePixelRatio||1,1.5);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);focal=Math.min(W,H)*.9}addEventListener("resize",resize);resize();
const N={grass:"Grass",dirt:"Dirt",stone:"Stone",log:"Log",leaves:"Leaves",planks:"Planks",craftingTable:"Crafting Table",sticks:"Sticks",woodPickaxe:"Wood Pickaxe",stonePickaxe:"Stone Pickaxe"},I={grass:"🌱",dirt:"🟫",stone:"🪨",log:"🪵",leaves:"🍃",planks:"🟨",craftingTable:"🧰",sticks:"🥢",woodPickaxe:"⛏",stonePickaxe:"⛏"},C={grass:[103,158,63],dirt:[130,85,48],stone:[124,129,134],log:[111,78,50],leaves:[59,118,55],planks:[183,138,83],craftingTable:[142,91,51]};
const inv={grass:0,dirt:0,stone:0,log:0,leaves:0,planks:0,craftingTable:0,sticks:0,woodPickaxe:0,stonePickaxe:0},hot=["dirt","grass","stone","log","planks","craftingTable"],recipes=[{n:"Planks ×4",o:["planks",4],i:{log:1}},{n:"Sticks ×4",o:["sticks",4],i:{planks:2}},{n:"Crafting Table",o:["craftingTable",1],i:{planks:4}},{n:"Wood Pickaxe",o:["woodPickaxe",1],i:{planks:3,sticks:2}},{n:"Stone Pickaxe",o:["stonePickaxe",1],i:{stone:3,sticks:2}}];let selected=0,seed=+(localStorage.bc_seed||0)||Math.floor(Math.random()*1e9),paused=false;
const B=new Map(),K=(x,y,z)=>x+","+y+","+z;let faces=[];const has=(x,y,z)=>B.has(K(x,y,z));
function rn(x,z,s=0){let n=(x*374761393+z*668265263+seed*69069+s*1447)|0;n=(n^(n>>>13))*1274126177|0;n^=n>>>16;return(n>>>0)/4294967295}function th(x,z){return 2+Math.floor(.9+Math.sin((x+seed%31)*.43)*.65+Math.cos((z-seed%23)*.37)*.55+Math.sin((x+z)*.21)*.45)}
function add(x,y,z,t){B.set(K(x,y,z),{x,y,z,t})}function rem(x,y,z){let k=K(x,y,z),b=B.get(k);if(!b)return null;B.delete(k);rebuild();return b.t}
const S=[{n:[-1,0,0],d:[-1,0,0],v:(x,y,z)=>[[x,y,z],[x,y+1,z],[x,y+1,z+1],[x,y,z+1]]},{n:[1,0,0],d:[1,0,0],v:(x,y,z)=>[[x+1,y,z+1],[x+1,y+1,z+1],[x+1,y+1,z],[x+1,y,z]]},{n:[0,-1,0],d:[0,-1,0],v:(x,y,z)=>[[x,y,z+1],[x+1,y,z+1],[x+1,y,z],[x,y,z]]},{n:[0,1,0],d:[0,1,0],v:(x,y,z)=>[[x,y+1,z],[x+1,y+1,z],[x+1,y+1,z+1],[x,y+1,z+1]]},{n:[0,0,-1],d:[0,0,-1],v:(x,y,z)=>[[x+1,y,z],[x+1,y+1,z],[x,y+1,z],[x,y,z]]},{n:[0,0,1],d:[0,0,1],v:(x,y,z)=>[[x,y,z+1],[x,y+1,z+1],[x+1,y+1,z+1],[x+1,y,z+1]]}];
function rebuild(){faces=[];B.forEach(b=>S.forEach(s=>{if(!has(b.x+s.d[0],b.y+s.d[1],b.z+s.d[2]))faces.push({k:K(b.x,b.y,b.z),t:b.t,n:s.n,v:s.v(b.x,b.y,b.z),cx:b.x+.5,cy:b.y+.5,cz:b.z+.5})}))}
function gen(){B.clear();for(let x=-10;x<10;x++)for(let z=-10;z<10;z++){let h=th(x,z);for(let y=-2;y<=h;y++)add(x,y,z,y===h?"grass":y>=h-2?"dirt":"stone")}for(let x=-8;x<=8;x++)for(let z=-8;z<=8;z++)if(!(Math.abs(x)<3&&Math.abs(z)<3)&&rn(x,z,7)>.937){let h=th(x,z),tr=3+(rn(x,z,9)>.65?1:0);for(let y=1;y<=tr;y++)add(x,h+y,z,"log");let top=h+tr;for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=-1;dy<=1;dy++)if(Math.abs(dx)+Math.abs(dz)+(dy===1?1:0)<=3&&!(dx===0&&dz===0&&dy<=0))add(x+dx,top+dy,z+dz,"leaves");add(x,top+2,z,"leaves")}rebuild()}
const p={x:.5,y:6,z:.5,vx:0,vy:0,vz:0,yaw:0,pitch:-.08,ground:false,h:1.72,r:.27,eye:1.58};function spawn(){p.x=.5;p.z=.5;p.y=th(0,0)+1.01;p.vx=p.vy=p.vz=0;p.yaw=0;p.pitch=-.08}function hitbox(x,y,z){for(let bx=Math.floor(x-p.r);bx<=Math.floor(x+p.r);bx++)for(let by=Math.floor(y);by<=Math.floor(y+p.h-.001);by++)for(let bz=Math.floor(z-p.r);bz<=Math.floor(z+p.r);bz++)if(has(bx,by,bz))return true;return false}
const mv={x:0,y:0},keys={};function jump(){if(!paused&&$("craft").style.display!=="flex"&&p.ground){p.vy=6.7;p.ground=false}}function phys(dt){if(paused||$("craft").style.display==="flex")return;let mx=mv.x,mf=-mv.y;if(keys.KeyA)mx--;if(keys.KeyD)mx++;if(keys.KeyW)mf++;if(keys.KeyS)mf--;let l=Math.hypot(mx,mf);if(l>1){mx/=l;mf/=l}let sy=Math.sin(p.yaw),cy=Math.cos(p.yaw),sp=4.2,tx=(mx*cy+mf*sy)*sp,tz=(-mx*sy+mf*cy)*sp,a=Math.min(1,dt*11);p.vx+=(tx-p.vx)*a;p.vz+=(tz-p.vz)*a;p.vy=Math.max(-18,p.vy-17*dt);let nx=p.x+p.vx*dt;if(!hitbox(nx,p.y,p.z))p.x=nx;else p.vx=0;let nz=p.z+p.vz*dt;if(!hitbox(p.x,p.y,nz))p.z=nz;else p.vz=0;let ny=p.y+p.vy*dt;if(!hitbox(p.x,ny,p.z)){p.y=ny;p.ground=false}else{if(p.vy<0)p.ground=true;p.vy=0}if(p.y<-7){spawn();flash("Respawned")}}
function cam(v){let dx=v[0]-p.x,dy=v[1]-(p.y+p.eye),dz=v[2]-p.z,sy=Math.sin(p.yaw),cy=Math.cos(p.yaw),x=dx*cy-dz*sy,z0=dx*sy+dz*cy,sp=Math.sin(p.pitch),cp=Math.cos(p.pitch);return[x,dy*cp-z0*sp,dy*sp+z0*cp]}function proj(v){let q=cam(v);return q[2]<=.08?null:[W/2+q[0]*focal/q[2],H/2-q[1]*focal/q[2],q[2]]}function col(t,n,d){let c=C[t]||[150,100,70],s=n[1]>0?1.15:n[1]<0?.55:Math.abs(n[0])?.84:.72,f=Math.max(0,Math.min(.72,(d-10)/25)),r=c[0]*s,g=c[1]*s,b=c[2]*s;return`rgb(${(r*(1-f)+120*f)|0},${(g*(1-f)+181*f)|0},${(b*(1-f)+228*f)|0})`}
let target=null;function ray(){let cp=Math.cos(p.pitch),sp=Math.sin(p.pitch),sy=Math.sin(p.yaw),cy=Math.cos(p.yaw),dx=sy*cp,dy=sp,dz=cy*cp,ox=p.x,oy=p.y+p.eye,oz=p.z,prev=null,last="";for(let d=.1;d<=5.2;d+=.045){let x=Math.floor(ox+dx*d),y=Math.floor(oy+dy*d),z=Math.floor(oz+dz*d),k=K(x,y,z);if(k===last)continue;if(has(x,y,z))return{k,x,y,z,place:prev,b:B.get(k)};prev={x,y,z};last=k}return null}
function render(){let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,"#69aee4");sky.addColorStop(.65,"#acdcef");sky.addColorStop(1,"#d7ecf3");ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle="rgba(255,246,190,.78)";ctx.beginPath();ctx.arc(W*.79,H*.15,22,0,Math.PI*2);ctx.fill();target=ray();let d=[];for(let f of faces){let vx=p.x-f.cx,vy=p.y+p.eye-f.cy,vz=p.z-f.cz;if(f.n[0]*vx+f.n[1]*vy+f.n[2]*vz<=0)continue;let pts=[],z=0,ok=true;for(let v of f.v){let q=proj(v);if(!q){ok=false;break}pts.push(q);z+=q[2]}if(!ok)continue;z/=4;if(z>34)continue;d.push({f,pts,z})}d.sort((a,b)=>b.z-a.z);for(let x of d){let q=x.pts;ctx.beginPath();ctx.moveTo(q[0][0],q[0][1]);for(let i=1;i<4;i++)ctx.lineTo(q[i][0],q[i][1]);ctx.closePath();ctx.fillStyle=col(x.f.t,x.f.n,x.z);ctx.fill();ctx.strokeStyle="rgba(0,0,0,.13)";ctx.lineWidth=.6;ctx.stroke();if(target&&x.f.k===target.k){ctx.strokeStyle="#fff";ctx.lineWidth=2;ctx.stroke()}}}
function tool(){return inv.stonePickaxe?"Stone Pickaxe":inv.woodPickaxe?"Wood Pickaxe":"Hand"}function refresh(){let h=$("hot");h.innerHTML="";hot.forEach((t,i)=>{let d=document.createElement("div");d.className="slot"+(selected===i?" sel":"");d.innerHTML=`<span class=num>${i+1}</span>${I[t]}<span class=cnt>${inv[t]||0}</span>`;d.onpointerdown=e=>{e.preventDefault();selected=i;refresh()};h.appendChild(d)});$("stats").textContent="❤️ 10 · ⛏ "+tool();if($("craft").style.display==="flex")craftUI()}function flash(s){let m=$("msg");m.textContent=s;m.style.opacity=1;clearTimeout(flash.t);flash.t=setTimeout(()=>m.style.opacity=0,1200)}
function can(r){return Object.entries(r.i).every(([k,n])=>(inv[k]||0)>=n)}function craftUI(){$("inv").innerHTML=Object.entries(inv).filter(([,n])=>n).map(([k,n])=>`${I[k]} ${N[k]}: <b>${n}</b>`).join(" · ")||"Inventory empty — break a tree first.";let el=$("recipes");el.innerHTML="";recipes.forEach(r=>{let row=document.createElement("div");row.className="recipe";row.innerHTML=`<div><strong>${r.n}</strong><br><small>${Object.entries(r.i).map(([k,n])=>n+" "+N[k]).join(" + ")}</small></div>`;let b=document.createElement("button");b.className="cb";b.textContent="CRAFT";b.disabled=!can(r);b.onclick=()=>{if(!can(r))return;Object.entries(r.i).forEach(([k,n])=>inv[k]-=n);inv[r.o[0]]=(inv[r.o[0]]||0)+r.o[1];refresh();save();flash("Crafted "+r.n)};row.appendChild(b);el.appendChild(row)})}
function ms(t){let b={leaves:240,dirt:420,grass:470,log:820,planks:620,craftingTable:700,stone:1450}[t]||700,m=t==="stone"?(inv.stonePickaxe?3:inv.woodPickaxe?2:.68):(inv.stonePickaxe||inv.woodPickaxe?1.4:1);return b/m}let bh=false,bk="",be=0;function startBreak(){if(!paused){bh=true;bk="";be=0}}function stopBreak(){bh=false;bk="";be=0;$("progress").style.display="none";$("fill").style.width="0%"}function breaking(dt){if(!bh)return;if(!target){stopBreak();return}if(target.k!==bk){bk=target.k;be=0}be+=dt*1000;let pr=Math.min(1,be/ms(target.b.t));$("progress").style.display="block";$("fill").style.width=pr*100+"%";if(pr>=1){let t=rem(target.x,target.y,target.z);if(t&&!(t==="leaves"&&Math.random()>.4)){inv[t]=(inv[t]||0)+1;refresh();flash("Collected "+N[t])}save();stopBreak()}}
function place(){if(paused||!target||!target.place)return;let t=hot[selected];if(!(inv[t]>0)){flash("No "+N[t]+" to place");return}let q=target.place;if(Math.abs(q.x+.5-p.x)<.75&&Math.abs(q.z+.5-p.z)<.75&&q.y+1>p.y&&q.y<p.y+p.h){flash("You are standing there");return}add(q.x,q.y,q.z,t);rebuild();inv[t]--;refresh();save()}
function save(){try{localStorage.bc_seed=seed;localStorage.bc_save=JSON.stringify({seed,blocks:[...B.values()],inv,p:{x:p.x,y:p.y,z:p.z,yaw:p.yaw,pitch:p.pitch},selected})}catch(e){}}function load(){let d=null;try{d=JSON.parse(localStorage.bc_save||"null")}catch(e){}if(!d||!Array.isArray(d.blocks)){gen();spawn();save();return}seed=d.seed||seed;B.clear();d.blocks.forEach(b=>add(b.x,b.y,b.z,b.t));rebuild();Object.keys(inv).forEach(k=>inv[k]=d.inv?.[k]||0);if(d.p)Object.assign(p,d.p);selected=d.selected||0}function newWorld(){seed=Math.floor(Math.random()*1e9);Object.keys(inv).forEach(k=>inv[k]=0);gen();spawn();save();refresh();flash("New world created")}
const joy=$("joy"),stick=$("stick");let jid=null;function jm(e){let r=joy.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=r.width*.34,dx=e.clientX-cx,dy=e.clientY-cy,m=Math.hypot(dx,dy);if(m>max){dx=dx/m*max;dy=dy/m*max}stick.style.transform=`translate(${dx}px,${dy}px)`;mv.x=dx/max;mv.y=dy/max}joy.onpointerdown=e=>{e.preventDefault();jid=e.pointerId;joy.setPointerCapture(jid);jm(e)};joy.onpointermove=e=>{if(e.pointerId===jid)jm(e)};function je(e){if(e.pointerId===jid){jid=null;mv.x=mv.y=0;stick.style.transform="translate(0,0)"}}joy.onpointerup=je;joy.onpointercancel=je;
let lid=null,lx=0,ly=0;let look=$("look");look.onpointerdown=e=>{e.preventDefault();lid=e.pointerId;lx=e.clientX;ly=e.clientY;look.setPointerCapture(lid)};look.onpointermove=e=>{if(e.pointerId!==lid||paused)return;p.yaw-=(e.clientX-lx)*.0045;p.pitch=Math.max(-1.25,Math.min(1.25,p.pitch-(e.clientY-ly)*.0038));lx=e.clientX;ly=e.clientY};look.onpointerup=e=>{if(e.pointerId===lid)lid=null};look.onpointercancel=look.onpointerup;
$("jump").onpointerdown=e=>{e.preventDefault();jump()};$("place").onpointerdown=e=>{e.preventDefault();place()};$("craftbtn").onpointerdown=e=>{e.preventDefault();stopBreak();$("craft").style.display="flex";craftUI()};$("save").onpointerdown=e=>{e.preventDefault();save();flash("World saved")};let bb=$("break");bb.onpointerdown=e=>{e.preventDefault();startBreak()};bb.onpointerup=bb.onpointercancel=bb.onpointerleave=stopBreak;$("closecraft").onclick=()=>$("craft").style.display="none";$("craft").onpointerdown=e=>{if(e.target===$("craft"))$("craft").style.display="none"};
addEventListener("keydown",e=>{keys[e.code]=true;if(e.code==="Space"){e.preventDefault();jump()}if(e.code==="KeyQ")startBreak();if(e.code==="KeyE")place();if(e.code==="KeyC"){$("craft").style.display="flex";craftUI()}if(/^Digit[1-6]$/.test(e.code)){selected=+e.code.slice(5)-1;refresh()}});addEventListener("keyup",e=>{keys[e.code]=false;if(e.code==="KeyQ")stopBreak()});addEventListener("beforeunload",save);document.addEventListener("visibilitychange",()=>{if(document.hidden)save()});
load();refresh();flash("World loaded");let last=performance.now();function loop(t){let dt=Math.min(.04,(t-last)/1000||.016);last=t;phys(dt);breaking(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
}catch(err){document.body.innerHTML=`<div style="padding:20px;color:white;background:#711;font-family:system-ui">Startup error: ${err.message}</div>`;console.error(err)}})();
</script>
</body></html>
